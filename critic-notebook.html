/* ===================== documents ===================== */
function findDoc(key){ for(var i = 0; i < docs.length; i++) if(docs[i].key === key) return i; return -1; }
/* Save-as can rename the open document onto a key another record already holds — the file
   that was open under that name a moment ago. The renamed one wins; the stale row goes. */
function dropDuplicate(){
  var keep = activeDoc, k = docs[keep] && docs[keep].key;
  if(!k) return;
  for(var i = docs.length - 1; i >= 0; i--){
    if(i === keep || docs[i].key !== k) continue;
    docs.splice(i, 1);
    if(keep > i){ keep--; activeDoc--; }
  }
}
/* once a real file is open, the untouched sample is just noise in the list */
function pruneSample(){
  if(!folder) return;
  var s = findDoc('sample');
  if(s < 0 || s === activeDoc) return;
  if(docs[s].src !== docs[s].savedSrc) return;
  docs.splice(s, 1);
  if(activeDoc > s) activeDoc--;
}
function syncRecord(){
  var r = docs[activeDoc];
  if(!r) return;
  r.src = doc.src; r.savedSrc = savedSrc; r.history = history;
  r.handle = fileHandle; r.scrollTop = center.scrollTop;
}
/* keep the filename visible: a long path is trimmed from the left, never the right */
function shortPath(p, max){
  if(p.length <= max) return p;
  var sep = p.indexOf('\\') >= 0 ? '\\' : '/';
  var parts = p.split(sep), out = parts.pop();
  while(parts.length){
    var next = parts.pop() + sep + out;
    if(next.length + 2 > max) break;
    out = next;
  }
  return '…' + sep + out;
}
function fullPath(r){
  if(!r) return '';
  if(!r.path) return r.name;
  if(folder && folder.abs) return folder.abs + SEP + (SEP === '\\' ? r.path.replace(/\//g, '\\') : r.path);
  if(folder) return folder.name + '/' + r.path;
  return r.path;
}
function paintTitle(){
  var r = docs[activeDoc], full = fullPath(r);
  var el = document.getElementById('docname');
  el.textContent = shortPath(full, 72);
  el.title = full;
}
function activate(i){
  if(i === activeDoc) return;
  syncRecord();
  activeDoc = i;
  var r = docs[i];
  doc = parse(r.src);
  savedSrc = r.savedSrc; history = r.history || []; fileHandle = r.handle || null;
  openCell = null; insertAt = null; draft = ''; draftBase = ''; rowCache = []; lit = null;
  noteEdit = null;
  hidePop();
  pruneSample();
  if(r.path){ expandTo(r.path); saveExpanded(); }
  paintTitle();
  render();
  center.scrollTop = r.scrollTop || 0;
}

/* ===================== remembering the folder ===================== */
function idbOpen(){
  return new Promise(function(res, rej){
    var r = indexedDB.open('critic-notebook', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbSet(k, v){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error); };
    });
  }).catch(function(){});
}
function idbGet(k){
  return idbOpen().then(function(db){
    return new Promise(function(res){
      var t = db.transaction('kv', 'readonly'), q = t.objectStore('kv').get(k);
      q.onsuccess = function(){ res(q.result || null); };
      q.onerror = function(){ res(null); };
    });
  }).catch(function(){ return null; });
}
function restoreFolders(){
  if(!CAN_DIR || typeof indexedDB === 'undefined') return;
  idbGet('folders').then(function(list){
    if(Array.isArray(list) && list.length){ folderHistory = list; return; }
    /* migrate the single remembered handle the earlier version stored */
    return idbGet('dir').then(function(h){
      if(h) folderHistory = [{ handle: h, name: h.name, ts: Date.now() }];
    });
  }).then(function(){
    paintDocList();
    var top = folderHistory[0];
    if(!top || !top.handle || !top.handle.queryPermission) return;
    return top.handle.queryPermission({ mode: 'readwrite' }).then(function(p){
      if(p === 'granted') return useFolder(top.handle, true);
    });
  }).catch(function(){});
}
function openDoc(text, name, handle, path, key){
  var raw = text.replace(/^\uFEFF/, '');
  /* a CRLF file written back as LF reads as every line changed in git, so remember which
     this file used and restore it on save */
  var crlf = (raw.match(/\r\n/g) || []).length;
  var eol = (crlf > 0 && crlf >= (raw.match(/\n/g) || []).length / 2) ? '\r\n' : '\n';
  var src = raw.replace(/\r\n?/g, '\n');
  key = key || ('loose:' + name);
  var same = findDoc(key);
  var rec = { key: key, name: name || 'untitled.md', path: path || '', label: name, src: src,
              savedSrc: src, handle: handle || null, history: [], scrollTop: 0, eol: eol };
  if(same >= 0){ docs[same] = rec; activeDoc = -1; activate(same); }
  else { docs.push(rec); activeDoc = -1; activate(docs.length - 1); }
  center.scrollTop = 0;
  var n = openCount();
  toast(n ? rec.name + ' — ' + n + ' suggestion' + (n === 1 ? '' : 's') + ' to review'
          : rec.name + ' — no suggestions yet');
}
function openFile(f){
  if(f.loading) return;
  var i = findDoc(f.key);
  if(i >= 0){ if(i !== activeDoc) guardDirty(function(){ activate(i); }); return; }
  guardDirty(function(){
    f.loading = true;
    f.handle.getFile()
      .then(function(file){ return file.text(); })
      .then(function(t){ f.loading = false; openDoc(t, f.name, f.handle, f.path, f.key); })
      .catch(function(){ f.loading = false; toast('Could not read ' + f.name); });
  });
}
document.getElementById('doclist').addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-act2]');
  if(b){
    flushEditor();
    var a = b.dataset.act2;

    else if(a === 'file') openSingleFile();
    else if(a === 'paste') pastePanel();
    else if(a === 'refresh' && folder){
      files.forEach(function(f){ f.scanned = false; });
      useFolder(folder.handle, true);
    }
    return;
  }
  var db = ev.target.closest('button[data-dir]');
  if(db){
    var k = db.dataset.dir;
    if(expanded[k]) delete expanded[k]; else expanded[k] = true;
    saveExpanded();
    paintDocList();
    return;
  }
  var hb = ev.target.closest('button[data-hist]');
  if(hb){ flushEditor(); guardDirty(function(){ openHistory(+hb.dataset.hist); }); return; }
  var r = ev.target.closest('button[data-key]');
  if(!r) return;
  flushEditor();
  var key = r.dataset.key;
  var f = null;
  files.forEach(function(x){ if(x.key === key) f = x; });
  if(f){ openFile(f); return; }
  var i = findDoc(key);
  if(i >= 0 && i !== activeDoc) guardDirty(function(){ activate(i); });
});

/* ===================== unsaved-changes gate ===================== */
function guardDirty(next){
  if(!isDirty()){ next(); return; }
  var name = docs[activeDoc] ? docs[activeDoc].name : 'This document';
  var v = openPanel({
    narrow: true,
    title: 'Unsaved changes',
    body: '<p class="hint"><b>' + esc(name) + '</b> has changes that are not written to disk yet.</p>',
    foot: '<button type="button" class="btn" data-x="cancel">Cancel</button>' +
          '<button type="button" class="btn danger" data-x="discard">Discard</button>' +
          '<button type="button" class="btn primary" data-x="save">Save</button>'
  });
  v.querySelector('[data-x="cancel"]').addEventListener('click', function(){ v.remove(); });
  v.querySelector('[data-x="discard"]').addEventListener('click', function(){
    v.remove();
    doc = parse(savedSrc); history = []; rowCache = []; render();
    next();
  });
  v.querySelector('[data-x="save"]').addEventListener('click', function(){
    v.remove();
    saveFile().then(function(ok){ if(ok) next(); });
  });
}

/* ===================== save / open ===================== */
var topLevel = (function(){ try{ return window.self === window.top; }catch(e){ return false; } })();
var CAN_FS = topLevel && typeof window.showSaveFilePicker === 'function';
var CAN_DIR = topLevel && typeof window.showDirectoryPicker === 'function';
/* A blob download works from any origin the browser trusts, not just a local file — this
   used to name localhost explicitly, which left a Firefox or Safari visitor to a hosted copy
   with Copy as the only way to get their edits out. */
var CAN_DL = topLevel && (location.protocol === 'file:' || window.isSecureContext);
var SAVE_LABEL = CAN_FS ? 'Save' : CAN_DL ? 'Download' : 'Copy';
document.getElementById('btn-save').textContent = SAVE_LABEL;
document.getElementById('btn-save').title =
  CAN_FS ? 'Write the file (⌘S)' : CAN_DL ? 'Download the .md (⌘S)'
         : 'This page is sandboxed and cannot write files — copy instead (' + MOD + 'S)';

function exportText(){
  var src = doc.src, prot = protectedRanges(src), out = '', at = 0;
  prot.sort(function(a, b){ return a[0] - b[0]; });
  prot.forEach(function(r){
    if(r[0] < at) return;
    out += src.slice(at, r[0]).replace(/\n{3,}/g, '\n\n');
    out += src.slice(r[0], r[1]);
    at = r[1];
  });
  out += src.slice(at).replace(/\n{3,}/g, '\n\n');
  out = out.replace(/[ \t]+$/gm, '').replace(/\s*$/, '') + '\n';
  var r = docs[activeDoc];
  return (r && r.eol === '\r\n') ? out.replace(/\n/g, '\r\n') : out;
}
function suggestName(){
  var n = (docs[activeDoc] && docs[activeDoc].name) || 'untitled.md';
  return /\.(md|markdown|mdown|txt)$/i.test(n) ? n : n + '.md';
}
var MD_TYPES = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown'], 'text/plain': ['.txt'] } }];

function afterSave(name){
  savedSrc = doc.src;
  syncRecord();
  var r = docs[activeDoc];
  if(r) files.forEach(function(f){
    if(f.key === r.key){ f.count = (doc.src.match(MARK_RE_COUNT) || []).length; f.scanned = true; }
  });
  paintStatus(); paintDocList();
  toast('Saved to ' + name);
}
function saveFile(){
  flushEditor();
  var text = exportText();
  if(CAN_FS && fileHandle){
    return fileHandle.createWritable()
      .then(function(w){ return w.write(text).then(function(){ return w.close(); }); })
      .then(function(){ afterSave(fileHandle.name); return true; })
      .catch(function(){ return pickAndSave(text); });
  }
  if(CAN_FS) return pickAndSave(text);
  if(CAN_DL){ downloadText(text); return Promise.resolve(true); }
  copyPanel(text);
  return Promise.resolve(false);
}
/* Adopt a handle chosen in a Save-as. If the new file landed inside the connected folder,
   resolve() gives its path there, so the title and the file list both pick it up. */
function adoptHandle(h){
  fileHandle = h;
  var r = docs[activeDoc];
  if(!r){ paintTitle(); return Promise.resolve(); }
  r.name = h.name; r.handle = h; r.label = h.name; r.scratch = false;
  r.path = ''; r.key = 'loose:' + h.name;
  dropDuplicate();
  if(!folder || !folder.handle.resolve){ paintTitle(); paintDocList(); return Promise.resolve(); }
  var home = folder;
  return folder.handle.resolve(h).then(function(segs){
    if(segs){
      r.path = segs.join('/'); r.key = r.path;
      dropDuplicate();
      paintTitle();
      return useFolder(home.handle, true);
    }
    paintTitle(); paintDocList();
    offerFolderFor(h, home.name);
  }).catch(function(){ paintTitle(); paintDocList(); });
}
/* A file saved outside the connected folder has no path we can show — only its name. The
   picker can be anchored at that file, so connecting its folder is two clicks and the path
   comes back. Declining drops to file mode, which at least stops the pane from claiming the
   document belongs to a folder it does not. */
function offerFolderFor(h, homeName){
  if(!CAN_DIR){ toFileMode(); return; }
  var v = openPanel({
    narrow: true,
    title: 'Saved outside the folder',
    body: '<p class="hint"><b>' + esc(h.name) + '</b> was saved outside <b>' + esc(homeName) + '</b>, ' +
          'so its path is unknown — only the filename can be shown.</p>' +
          '<p class="hint">Opening its folder restores the full path and lists the files beside it.</p>',
    foot: '<button type="button" class="btn" data-x="single">Keep as a single file</button>' +
          '<button type="button" class="btn primary" data-x="folder">Open its folder</button>'
  });
  v.querySelector('[data-x="single"]').addEventListener('click', function(){ v.remove(); toFileMode(); });
  v.querySelector('[data-x="folder"]').addEventListener('click', function(){
    v.remove();
    pickFolder(h);
  });
}
function pickAndSave(text){
  return window.showSaveFilePicker({ suggestedName: suggestName(), types: MD_TYPES })
    .then(function(h){
      return h.createWritable().then(function(w){
        return w.write(text).then(function(){ return w.close(); });
      }).then(function(){
        return adoptHandle(h);
      }).then(function(){
        afterSave(h.name);
        return true;
      });
    })
    .catch(function(e){
      if(e && e.name === 'AbortError') return false;
      if(CAN_DL){ downloadText(text); return true; }
      copyPanel(text);
      return false;
    });
}
function saveAs(){
  flushEditor();
  var text = exportText();
  if(CAN_FS) return pickAndSave(text);
  if(CAN_DL){ downloadText(text); return Promise.resolve(true); }
  copyPanel(text);
  return Promise.resolve(false);
}
function downloadText(text){
  var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = suggestName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  savedSrc = doc.src; syncRecord(); paintStatus(); paintDocList();
  toast('Downloaded ' + suggestName());
}

/* Opening a single file that happens to live inside the connected folder should not throw
   the folder away — same rule as Save as. */
function adoptSingle(h, text){
  if(folder && folder.handle.resolve){
    return folder.handle.resolve(h).then(function(segs){
      if(segs){ openDoc(text, h.name, h, segs.join('/'), segs.join('/')); return; }
      toFileMode();
      openDoc(text, h.name, h, '', 'loose:' + h.name);
    }).catch(function(){
      toFileMode();
      openDoc(text, h.name, h, '', 'loose:' + h.name);
    });
  }
  toFileMode();
  openDoc(text, h.name, h, '', 'loose:' + h.name);
  return Promise.resolve();
}
function openSingleFile(){
  flushEditor();
  guardDirty(function(){
    if(CAN_FS && typeof window.showOpenFilePicker === 'function'){
      window.showOpenFilePicker(pickerOpts({ types: MD_TYPES, multiple: false })).then(function(hs){
        var h = hs[0];
        return h.getFile().then(function(f){ return f.text(); }).then(function(t){ return adoptSingle(h, t); });
      }).catch(function(e){
        if(e && e.name === 'AbortError') return;
        document.getElementById('file').click();
      });
      return;
    }
    document.getElementById('file').click();
  });
}
document.getElementById('btn-open').addEventListener('click', function(){
  flushEditor();
  guardDirty(function(){ pickFolder(); });
});
document.getElementById('btn-open').hidden = !CAN_DIR;
document.getElementById('btn-open').title = 'Pick a folder; its markdown files are listed on the left';
document.getElementById('btn-openfile').addEventListener('click', openSingleFile);
document.getElementById('btn-openfile').title = 'Open one file on its own';
document.getElementById('btn-save').addEventListener('click', function(){ saveFile(); });
var saveAsBtn = document.getElementById('btn-saveas');
saveAsBtn.hidden = !CAN_FS;
saveAsBtn.title = 'Write this document to a new file';
saveAsBtn.addEventListener('click', function(){ saveAs(); });
document.getElementById('file').addEventListener('change', function(ev){
  var list = Array.prototype.slice.call(ev.target.files || []);
  ev.target.value = '';
  list.forEach(function(f){
    var r = new FileReader();
    r.onload = function(){ openDoc(String(r.result), f.name, null); };
    r.readAsText(f);
  });
});

var dragDepth = 0, veilEl = null;
window.addEventListener('dragenter', function(ev){
  if(!ev.dataTransfer || Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') < 0) return;
  ev.preventDefault(); dragDepth++;
  if(!veilEl){
    veilEl = document.createElement('div');
    veilEl.className = 'drop';
    veilEl.innerHTML = '<div>Drop the .md to load it</div>';
    document.body.appendChild(veilEl);
  }
});
window.addEventListener('dragover', function(ev){ if(veilEl) ev.preventDefault(); });
window.addEventListener('dragleave', function(){ dragDepth--; if(dragDepth <= 0) clearDrop(); });
window.addEventListener('drop', function(ev){
  if(!veilEl) return;
  ev.preventDefault(); clearDrop();
  var list = Array.prototype.slice.call((ev.dataTransfer && ev.dataTransfer.files) || []);
  list.forEach(function(f){
    var r = new FileReader();
    r.onload = function(){ openDoc(String(r.result), f.name, null); };
    r.readAsText(f);
  });
});
function clearDrop(){ dragDepth = 0; if(veilEl){ veilEl.remove(); veilEl = null; } }

window.addEventListener('beforeunload', function(ev){
  syncRecord();
  var anyDirty = isDirty() || docs.some(function(r, i){ return i !== activeDoc && r.src !== r.savedSrc; });
  if(!anyDirty && openCell === null && insertAt === null) return;
  ev.preventDefault();
  ev.returnValue = '';
});

/* ===================== modals ===================== */
function openPanel(opts){
  hidePop();
  var veil = document.createElement('div');
  veil.className = 'veil';
  veil.innerHTML =
    '<div class="panel' + (opts.narrow ? ' narrow' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
      '<div class="phead"><b>' + esc(opts.title) + '</b></div>' +
      '<div class="pbody">' + opts.body + '</div>' +
      '<div class="pfoot">' + opts.foot + '</div></div>';
  veil.addEventListener('click', function(ev){ if(ev.target === veil) veil.remove(); });
  veil.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') veil.remove(); });
  document.body.appendChild(veil);
  if(opts.after) opts.after(veil);
  return veil;
}
function pastePanel(){
  flushEditor();
  var v = openPanel({
    title: 'Paste Markdown',
    body: '<p class="hint">Paste the document text. CriticMarkup marks in it are picked up; plain markdown is fine too.</p>' +
          '<textarea id="pastebox" spellcheck="false" placeholder="# Title&#10;&#10;Body text…"></textarea>',
    foot: '<button type="button" class="btn" data-x="close">Cancel</button>' +
          '<button type="button" class="btn primary" id="pasteok">Load</button>',
    after: function(el){ el.querySelector('#pastebox').focus(); }
  });
  v.querySelector('[data-x="close"]').addEventListener('click', function(){ v.remove(); });
  v.querySelector('#pasteok').addEventListener('click', function(){
    var t = v.querySelector('#pastebox').value;
    v.remove();
    if(t.trim()) openDoc(t, 'pasted.md', null, '', 'loose:pasted.md');
  });
}
function copyPanel(text){
  var v = openPanel({
    title: 'Copy the Markdown',
    body: '<p class="hint">This page runs in a sandboxed frame and cannot write files. Copy the text below over your .md.</p>' +
          '<textarea id="outbox" readonly spellcheck="false"></textarea>',
    foot: '<button type="button" class="btn" data-x="close">Close</button>' +
          '<button type="button" class="btn primary" id="copyok">Copy all</button>',
    after: function(el){ el.querySelector('#outbox').value = text; }
  });
  v.querySelector('[data-x="close"]').addEventListener('click', function(){ v.remove(); });
  v.querySelector('#copyok').addEventListener('click', function(){
    var box = v.querySelector('#outbox');
    function manual(){
      box.focus(); box.select();
      toast('Press ' + (APPLE ? '⌘C' : 'Ctrl+C'));
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          savedSrc = doc.src; syncRecord(); paintStatus(); paintDocList(); toast('Copied');
        }, manual);
      } else manual();
    } catch(e){ manual(); }
  });
}

var toastTimer = null;
function toast(msg){
  var old = document.querySelector('.toast');
  if(old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.remove(); }, 2200);
}

/* ===================== boot ===================== */
document.querySelectorAll('[data-mod]').forEach(function(k){ k.textContent = MOD + k.dataset.mod; });

(function initPanes(){
  var wide = window.innerWidth >= 1180, mid = window.innerWidth >= 880;
  function want(key, dflt){
    try{ var v = localStorage.getItem('cm-pane-' + key); return v === null ? dflt : v === '1'; }
    catch(e){ return dflt; }
  }
  var side = want('side', mid), out = want('out', wide);
  app.classList.toggle('side-open', side);
  app.classList.toggle('out-open', out);
  document.getElementById('tog-side').setAttribute('aria-pressed', String(side));
  document.getElementById('tog-out').setAttribute('aria-pressed', String(out));
})();

docs.push({ key: 'sample', name: 'tutorial.md', path: '', label: 'tutorial.md', scratch: true,
            src: SAMPLE, savedSrc: SAMPLE, handle: null, history: [], scrollTop: 0 });
activeDoc = 0;
paintTitle();
render();
restoreFolders();
})();
</script>
