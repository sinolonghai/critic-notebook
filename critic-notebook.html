<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CriticMarkup Review Desk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Three panes: document list, the notebook, the outline. One cell per markdown block;
   clicking a cell opens a plain-text editor with a live "recorded as" diff below it. Every
   commit writes straight to the source string — undo is the single safety net. */
:root{
  --paper:#f5f7f9; --surface:#ffffff; --surface-2:#eef1f5;
  --ink:#16202e; --ink-soft:#5b6779; --ink-faint:#8b96a6;
  --rule:#dde2ea; --rule-strong:#c3ccd9;
  --accent:#1f4d8f; --accent-soft:rgba(31,77,143,.10);
  --ins:#0f7a52; --ins-bg:rgba(15,122,82,.13); --ins-line:rgba(15,122,82,.45);
  --del:#ad382c; --del-bg:rgba(173,56,44,.13); --del-line:rgba(173,56,44,.45);
  --note:#8a5a00; --note-bg:rgba(138,90,0,.13);
  --hil-bg:rgba(222,180,32,.34);
  --shadow:0 1px 2px rgba(22,32,46,.06), 0 6px 18px rgba(22,32,46,.07);
  --pop-shadow:0 2px 6px rgba(22,32,46,.14), 0 14px 34px rgba(22,32,46,.18);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --doc:"Source Serif 4",Georgia,"Songti SC",serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --wside:236px; --wout:228px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141b; --surface:#171d26; --surface-2:#1e2530;
    --ink:#e3e8ef; --ink-soft:#97a3b4; --ink-faint:#6c7889;
    --rule:#28303c; --rule-strong:#3a4455;
    --accent:#7fa9e9; --accent-soft:rgba(127,169,233,.14);
    --ins:#4fc68e; --ins-bg:rgba(79,198,142,.16); --ins-line:rgba(79,198,142,.5);
    --del:#f0897b; --del-bg:rgba(240,137,123,.16); --del-line:rgba(240,137,123,.5);
    --note:#dcab45; --note-bg:rgba(220,171,69,.15);
    --hil-bg:rgba(222,180,32,.26);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --pop-shadow:0 2px 6px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141b; --surface:#171d26; --surface-2:#1e2530;
  --ink:#e3e8ef; --ink-soft:#97a3b4; --ink-faint:#6c7889;
  --rule:#28303c; --rule-strong:#3a4455;
  --accent:#7fa9e9; --accent-soft:rgba(127,169,233,.14);
  --ins:#4fc68e; --ins-bg:rgba(79,198,142,.16); --ins-line:rgba(79,198,142,.5);
  --del:#f0897b; --del-bg:rgba(240,137,123,.16); --del-line:rgba(240,137,123,.5);
  --note:#dcab45; --note-bg:rgba(220,171,69,.15);
  --hil-bg:rgba(222,180,32,.26);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --pop-shadow:0 2px 6px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--rule);flex:0 0 auto;z-index:8}
.pane-tog{display:flex;gap:4px;flex:0 0 auto}
.pane-tog button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:6px;
  width:28px;height:26px;padding:0;cursor:pointer;color:var(--ink-faint);font-family:var(--mono);font-size:11px;line-height:1}
.pane-tog button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 200px}
.brand b{font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.brand .dirty{color:var(--note);font-size:15px;line-height:1;flex:0 0 auto}
.brand .meta{color:var(--ink-faint);font-size:12px;white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums}

.seg{display:flex;background:var(--surface-2);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(22,32,46,.12)}
.whoami{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);white-space:nowrap}
.whoami input{width:84px;padding:4px 7px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--paper);font-size:12.5px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--rule-strong);background:var(--surface);padding:5px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.42;cursor:default}
.btn:disabled:hover{border-color:var(--rule-strong);color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}

.status{background:var(--surface-2);border-bottom:1px solid var(--rule);flex:0 0 auto;
  padding:6px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;z-index:7}
.status .txt{color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:1 1 auto}
.status .mini{display:flex;gap:5px}
.status .mini button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:5px;
  padding:3px 9px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.status .mini button:hover{border-color:var(--accent);color:var(--accent)}
.status .mini button:disabled{opacity:.4;cursor:default}
.status .mini button:disabled:hover{border-color:var(--rule-strong);color:inherit}

/* ---------- three panes ---------- */
.shell{flex:1 1 auto;display:grid;grid-template-columns:var(--wside) minmax(0,1fr) var(--wout);min-height:0}
.app:not(.side-open){--wside:0px}
.app:not(.out-open){--wout:0px}
.app:not(.side-open) .side{display:none}
.app:not(.out-open) .outline{display:none}

.pane{overflow-y:auto;overscroll-behavior:contain;background:var(--surface);min-width:0;display:flex;flex-direction:column}
.side{border-right:1px solid var(--rule)}
.outline{border-left:1px solid var(--rule)}
.center{overflow-y:auto;min-width:0;background:var(--paper)}

.pane-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);
  padding:9px 12px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  display:flex;align-items:center;gap:8px;z-index:2}
.pane-head b{flex:1;font-weight:600;letter-spacing:.08em}
.pane-head .ct{font-family:var(--mono);font-size:10px;opacity:.8}
.pane-body{flex:1;padding:7px;display:flex;flex-direction:column;gap:2px}
.pane-foot{border-top:1px solid var(--rule);padding:9px 12px;font-size:11px;color:var(--ink-faint);line-height:1.55}
.pane-foot .ver{display:block;margin-top:7px;font-family:var(--mono);font-size:10px;opacity:.6;
  letter-spacing:.02em}
.pane-foot kbd{font-family:var(--mono);font-size:10px;background:var(--surface-2);border:1px solid var(--rule-strong);
  border-bottom-width:2px;border-radius:4px;padding:0 4px}
.pane-empty{padding:16px 12px;font-size:12px;color:var(--ink-faint);line-height:1.65}

/* document list */
.doc-row{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:1px solid transparent;
  background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer;min-width:0}
.doc-row:hover{background:var(--surface-2)}
.doc-row[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.doc-row .nm{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-row[aria-current="true"] .nm{font-weight:500}
.doc-row .badge{flex:0 0 auto;font-family:var(--mono);font-size:10px;background:var(--note-bg);color:var(--note);
  border-radius:4px;padding:1px 5px;font-weight:600}
.doc-row .udot{flex:0 0 auto;color:var(--note);font-size:14px;line-height:1}
.doc-row.pend .nm{opacity:.55}

.grp{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:9px 8px 3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp:first-child{padding-top:2px}
.folder-bar{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid var(--rule);
  margin:-7px -7px 5px;background:var(--surface-2)}
.folder-bar .fn{flex:1;min-width:0;font-size:12px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.folder-bar button{flex:0 0 auto;border:1px solid var(--rule-strong);background:var(--surface);
  border-radius:5px;width:24px;height:22px;padding:0;cursor:pointer;font-size:11px;line-height:1;color:var(--ink-faint)}
.folder-bar button:hover{border-color:var(--accent);color:var(--accent)}
.cta-row{display:flex;flex-wrap:wrap;gap:5px;padding:12px 2px 2px;margin-top:6px;border-top:1px solid var(--rule)}
.cta-row button{flex:1 1 auto;border:1px dashed var(--rule-strong);background:transparent;border-radius:7px;
  padding:7px 9px;cursor:pointer;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.cta-row button:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.doc-row .ico{flex:0 0 auto;display:inline-flex;align-items:center;width:13px;height:13px;color:var(--ink-faint)}
.doc-row .ico svg{display:block}
.doc-row .ico.doc{color:var(--rule-strong)}
.doc-row:hover .ico.doc,.doc-row[aria-current="true"] .ico.doc{color:var(--ink-faint)}
.doc-row.dir .nm{font-weight:500}
.doc-row.dir .ico{color:var(--ink-soft)}
.doc-row.dir[aria-expanded="true"] .ico{color:var(--accent)}
.doc-row.hist .ico{color:var(--ink-faint);opacity:.7}
.doc-row .cnt{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint);opacity:.75}
.doc-row.hist .nm{color:var(--ink-soft)}
.doc-row.hist:hover .nm{color:var(--ink)}

/* outline */
.out-row{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;border:0;background:transparent;
  border-radius:6px;padding:4px 8px;cursor:pointer;min-width:0;border-left:2px solid transparent}
.out-row:hover{background:var(--surface-2)}
.out-row[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.out-row .t{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)}
.out-row[aria-current="true"] .t{color:var(--ink);font-weight:500}
.out-row.l1 .t{font-size:12.5px;font-weight:600;color:var(--ink)}
.out-row.l3{padding-left:20px}
.out-row.l4{padding-left:32px}
.out-row .ct{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;color:var(--note);
  background:var(--note-bg);border-radius:3px;padding:0 4px;font-weight:600}
.jump{margin:0;display:flex;gap:6px}
.jump button{flex:1;border:1px solid var(--rule-strong);background:var(--surface);border-radius:6px;
  padding:5px 8px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.jump button:hover{border-color:var(--accent);color:var(--accent)}
.jump button:disabled{opacity:.4;cursor:default}
.jump button:disabled:hover{border-color:var(--rule-strong);color:inherit}

/* ---------- notebook ---------- */
.lead{max-width:47rem;margin:0 auto;padding:14px 16px 0;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
.lead b{color:var(--ink);font-weight:600}
.lead kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--rule-strong);
  border-bottom-width:2px;border-radius:4px;padding:0 4px}
.nb{max-width:47rem;margin:0 auto;padding:4px 16px 50vh}

.gap{height:16px;position:relative;display:flex;align-items:center;justify-content:center}
.gap button{opacity:0;transition:opacity .12s;border:1px dashed var(--rule-strong);background:var(--paper);
  color:var(--ink-faint);border-radius:999px;font-size:11px;line-height:1;padding:3px 13px;cursor:pointer;font-family:var(--mono)}
.gap:hover button,.gap button:focus-visible{opacity:1}
.gap::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule);opacity:0;transition:opacity .12s}
.gap:hover::before{opacity:1}

.cell{display:grid;grid-template-columns:34px minmax(0,1fr);position:relative}
.cell .rail{grid-column:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);user-select:none}
.cell .rail .n{font-variant-numeric:tabular-nums;opacity:.55}
.cell .rail .bar2{flex:1;width:2px;border-radius:1px;background:transparent;min-height:10px}
.cell:hover .rail .bar2{background:var(--rule-strong)}
.cell.open .rail .bar2{background:var(--accent)}
.cell.open .rail .n{color:var(--accent);opacity:1;font-weight:500}
.cell.touched .rail .bar2{background:var(--note)}
/* in Original / Final the inline marks are gone, so this flag is the only signal that a
   block was touched; clicking it goes back to Marked up and lands on the block */
.cell .flag{border:0;background:var(--del);color:#fff;border-radius:999px;min-width:16px;height:16px;
  padding:0 4px;font-family:var(--mono);font-size:9.5px;font-weight:600;line-height:16px;cursor:pointer;
  box-shadow:0 0 0 2px var(--paper)}
.cell .flag:hover{filter:brightness(1.12)}
.cell .flag.note-only{background:var(--note)}
.cell .body{grid-column:2;min-width:0;padding:2px 0 8px}

.out{font-family:var(--doc);font-size:16.5px;line-height:1.78;border-radius:8px;
  padding:3px 9px;margin:0 -9px;cursor:text;transition:background .12s}
.cell.editable .out:hover{background:var(--surface)}
.cell.locked .out{cursor:default}
.out>:first-child{margin-top:0}
.out>:last-child{margin-bottom:0}
.out .md-h{font-family:var(--ui);line-height:1.3;text-wrap:balance;margin:.15em 0 .3em;font-weight:600;letter-spacing:-.005em}
.out h1.md-h{font-size:1.5em}
.out h2.md-h{font-size:1.2em}
.out h3.md-h{font-size:1.04em;color:var(--ink-soft)}
.out p{margin:0 0 .6em}
.out ul,.out ol{margin:0 0 .6em;padding-left:1.4em}
.out li{margin:.22em 0}
.out blockquote{margin:0 0 .6em;padding:.1em 0 .1em 1em;border-left:3px solid var(--rule-strong);color:var(--ink-soft)}
.out hr{border:0;border-top:1px solid var(--rule);margin:.9em 0}
.out code{font-family:var(--mono);font-size:.84em;background:var(--surface-2);padding:.12em .36em;border-radius:4px}
.out .md-pre{font-family:var(--mono);font-size:.78em;line-height:1.6;background:var(--surface-2);
  border:1px solid var(--rule);border-radius:8px;padding:11px 13px;overflow-x:auto;margin:0}
.out .md-pre code{background:none;padding:0;font-size:1em}
.out a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.out ::selection{background:var(--accent-soft)}
.tw{overflow-x:auto;margin:0 0 .6em}
.out table{border-collapse:collapse;font-family:var(--ui);font-size:.82em;min-width:100%}
.out th,.out td{border:1px solid var(--rule);padding:5px 9px;text-align:left;vertical-align:top}
.out th{background:var(--surface-2);font-weight:600}

.cm{border-radius:3px}
.cm.ins{color:var(--ins);background:var(--ins-bg);text-decoration:underline;
  text-decoration-color:var(--ins-line);text-decoration-thickness:1.5px;text-underline-offset:2.5px;padding:.04em .1em}
.cm.del{color:var(--del);background:var(--del-bg);text-decoration:line-through;
  text-decoration-color:var(--del-line);text-decoration-thickness:1.5px;padding:.04em .1em}
.cm.hil{background:var(--hil-bg);padding:.04em .12em}
.cm.dagger{font-family:var(--ui);color:var(--note);background:var(--note-bg);font-size:.7em;
  padding:.1em .34em;vertical-align:.32em;border-radius:4px;font-weight:600;line-height:1;cursor:pointer}
.cm.lit{box-shadow:0 0 0 2px var(--accent)}

.blk{border-left:3px solid var(--rule-strong);padding:1px 0 1px 11px;margin:0 0 .5em}
.blk>:first-child{margin-top:0}
.blk>:last-child{margin-bottom:0}
.blk.del{border-color:var(--del);color:var(--del);text-decoration:line-through;text-decoration-color:var(--del-line)}
.blk.ins{border-color:var(--ins);color:var(--ins)}
.blk.lit{box-shadow:0 0 0 2px var(--accent);border-radius:0 4px 4px 0}

.ed{background:var(--surface);border:1px solid var(--accent);border-radius:9px;overflow:hidden}
.ed textarea{width:100%;border:0;outline:0;resize:none;background:transparent;display:block;
  font-family:var(--doc);font-size:16px;line-height:1.72;padding:11px 13px;min-height:4.2em}
.edbar{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--surface-2);
  border-top:1px solid var(--rule);flex-wrap:wrap}
.edbar .hint{font-size:11.5px;color:var(--ink-faint);flex:1}
.edbar .hint b{color:var(--note);font-weight:600}
.edbar kbd{font-family:var(--mono);font-size:10px;background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:0 3px}
.edbar button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:6px;
  padding:4px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.edbar button:hover{border-color:var(--accent);color:var(--accent)}
.prev{border-top:1px dashed var(--rule-strong);padding:9px 13px 11px;background:var(--paper)}
.prev .lab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.prev .inner{font-family:var(--doc);font-size:15.5px;line-height:1.72}
.prev .inner>:first-child{margin-top:0}
.prev .inner>:last-child{margin-bottom:0}
.prev .none{font-family:var(--ui);font-size:12.5px;color:var(--ink-faint);margin:0}

.marks{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mk{display:flex;align-items:flex-start;gap:8px;padding:6px 9px;border-radius:7px;
  background:var(--surface);border:1px solid var(--rule);font-size:12.5px;position:relative}
.mk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:7px 0 0 7px;background:var(--rule-strong)}
.mk[data-k="ins"]::before{background:var(--ins)}
.mk[data-k="del"]::before{background:var(--del)}
.mk[data-k="sub"]::before{background:linear-gradient(var(--del) 50%,var(--ins) 50%)}
.mk[data-k="com"]::before,.mk[data-k="hil"]::before{background:var(--note)}
.mk.lit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mk .chip{flex:0 0 auto;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 6px;
  border-radius:4px;background:var(--surface-2);color:var(--ink-soft);margin-top:1px}
.mk[data-k="ins"] .chip{background:var(--ins-bg);color:var(--ins)}
.mk[data-k="del"] .chip{background:var(--del-bg);color:var(--del)}
.mk[data-k="com"] .chip,.mk[data-k="hil"] .chip{background:var(--note-bg);color:var(--note)}
.mk .txt{flex:1;min-width:0;font-family:var(--doc);line-height:1.5;word-break:break-word}
.mk .txt .was{color:var(--del);text-decoration:line-through;text-decoration-thickness:1px}
.mk .txt .now{color:var(--ins)}
.mk .txt .arrow{color:var(--ink-faint);font-family:var(--mono);font-size:11px;margin:0 5px}
.mk .txt .quote{color:var(--ink-soft)}
.mk .note{display:block;margin-top:4px;font-family:var(--ui);font-size:12px;line-height:1.5;
  text-align:left;border:1px solid transparent;border-radius:5px;margin-left:-4px;padding:1px 4px;
  cursor:text;background:transparent;color:inherit;width:calc(100% + 8px)}

<div class="app side-open out-open" id="app">
  <div class="bar">
    <div class="pane-tog">
      <button type="button" id="tog-side" aria-pressed="true" title="Documents pane" aria-label="Toggle documents pane">◧</button>
      <button type="button" id="tog-out" aria-pressed="true" title="Outline pane" aria-label="Toggle outline pane">◨</button>
    </div>
    <div class="brand">
      <b id="docname">tutorial.md</b>
      <span class="dirty" id="dirty" hidden title="unsaved changes">●</span>
      <span class="meta" id="docmeta"></span>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="markup" aria-pressed="true">Marked up</button>
      <button type="button" data-view="original" aria-pressed="false">Original</button>
      <button type="button" data-view="final" aria-pressed="false">Final</button>
      <button type="button" data-view="compare" aria-pressed="false">Compare</button>
    </div>
    <div class="whoami">
      <label for="author" title="Your suggestions are attributed to this name">Sign as</label>
      <input type="text" id="author" placeholder="your name" maxlength="16" autocomplete="off" spellcheck="false"
             title="Your suggestions are attributed to this name, written into the file as @name">
    </div>
    <div class="tools">
      <button type="button" class="btn" id="btn-undo" disabled>Undo</button>
      <button type="button" class="btn" id="btn-open">Open folder</button>
      <button type="button" class="btn" id="btn-openfile">Open file</button>
      <button type="button" class="btn" id="btn-saveas" hidden>Save as…</button>
      <button type="button" class="btn primary" id="btn-save">Save</button>
    </div>
  </div>

  <div class="status">
    <span class="txt" id="stxt"></span>
    <span class="mini">
      <button type="button" id="btn-all-yes">Accept all</button>
      <button type="button" id="btn-all-no">Reject all</button>
    </span>
  </div>

  <div class="shell">
    <aside class="pane side" id="side">
      <div class="pane-head"><b>Documents</b><span class="ct" id="doc-ct"></span></div>
      <div class="pane-body" id="doclist"></div>
      <div class="pane-foot" id="side-foot"></div>
    </aside>

    <main class="center" id="center">
      <p class="lead" id="lead"><b>Click any block</b> to edit its text; what you changed is recorded as a
      tracked suggestion. Opening another block commits the one you were in — <kbd>Esc</kbd> discards
      instead. Select a phrase to leave a comment. <kbd data-mod="Z">⌘Z</kbd> undoes anything.</p>
      <div class="nb" id="nb"></div>
    </main>

    <aside class="pane outline" id="outline">
      <div class="pane-head"><b>Outline</b><span class="ct" id="out-ct"></span></div>
      <div class="pane-body" id="outlist"></div>
      <div class="pane-foot">
        <div class="jump">
          <button type="button" id="jump-prev" title="Previous block with suggestions">↑ prev</button>
          <button type="button" id="jump-next" title="Next block with suggestions">next ↓</button>
        </div>
      </div>
    </aside>
  </div>
</div>

'- Select a phrase to leave a comment {==on that exact phrase==}{>>@dana: like this one<<}',

'| `{==text==}` | highlight | yellow |',
'',
'> A comment written straight after a change belongs to it, and shows up as its reason.',
'> Start one with `@name:` and it is attributed to that person.',
'',

'one gives the edited text. The original is {--kept--}{++held++} inside the mark, so committing',

'',
'```js',

'```',
'',
'This last paragraph has no suggestions on it. Change a few words here and watch the diff',

/* ===================== parse ===================== */
var PH = '\u0001';
var MARK_RE = /\{\+\+([\s\S]*?)\+\+\}|\{--([\s\S]*?)--\}|\{~~([\s\S]*?)~>([\s\S]*?)~~\}|\{>>([\s\S]*?)<<\}|\{==([\s\S]*?)==\}/g;

/* Code spans and fences are found on a copy with every mark blanked out to spaces of the
   same length, so offsets still line up.

   Without that, a mark whose text contains one backtick — {~~`name`~>**name**~~}, which a diff
   produces the moment formatting changes — leaves a stray backtick that pairs with the next
   one in the document. The span that results straddles the following mark's opener, the mark
   is treated as code, and it silently disappears. A literal `{++x++}` written as code still
   works: blanking leaves its surrounding backticks adjacent, so the span still covers it. */
function protectedRanges(src){
  MARK_RE.lastIndex = 0;
  var mask = src.replace(MARK_RE, function(m){ return m.replace(/[^\n]/g, ' '); });
  var r = [], m;

  while((m = code.exec(mask))){
    var inside = r.some(function(x){ return m.index >= x[0] && m.index < x[1]; });

function parse(src){
  var prot = protectedRanges(src);
  function guarded(i){ return prot.some(function(x){ return i >= x[0] && i < x[1]; }); }

  MARK_RE.lastIndex = 0;
  while((m = MARK_RE.exec(src))){
    if(guarded(m.index)) continue;
    if(m.index > last) tokens.push({ t:'text', v: src.slice(last, m.index), start: last });
    var mk;
    if(m[1] !== undefined)      mk = { t:'ins', add:m[1] };
    else if(m[2] !== undefined) mk = { t:'del', rem:m[2] };
    else if(m[3] !== undefined) mk = { t:'sub', rem:m[3], add:m[4] };
    else if(m[5] !== undefined) mk = { t:'com', body:m[5] };
    else                        mk = { t:'hil', body:m[6] };
    mk.raw = m[0]; mk.start = m.index; mk.end = m.index + m[0].length; mk.id = marks.length;
    marks.push(mk); tokens.push(mk);
    last = mk.end;
  }
  if(last < src.length) tokens.push({ t:'text', v: src.slice(last), start: last });

    var cur = tokens[i], prev = tokens[i-1];

    }

  marks.forEach(function(mk){
    var txt = mk.note !== undefined ? mk.note : (mk.t === 'com' ? mk.body : null);
    if(txt === null) return;

      var kid = marks[mk.id + 1];
      if(kid && kid.attached){ kid.who = a[1]; kid.body = rest; }

/* ===================== working string + offset map ===================== */
/* A mark whose content spans a blank line is a whole block. Its placeholder gets synthetic
   newlines around it so block detection sees it standing alone — otherwise a pending new
   paragraph renders glued to its neighbour. The synthetic chars exist only in the working
   string; they map to the mark's own start/end so cell ranges stay exact. */

  var work = '', segs = [], map = [], T = doc.tokens;
  function pushPH(tk){

    for(var j = 0; j < ph.length; j++) map.push(tk.start);

  for(var i = 0; i < T.length; i++){
    var tk = T[i];
    if(tk.t === 'text'){
      segs.push({ w: work.length, s: tk.start, len: tk.v.length });
      for(var k = 0; k < tk.v.length; k++) map.push(tk.start + k);
      work += tk.v;
      continue;

    var blocky = /\n[ \t]*\n/.test([tk.add, tk.rem, tk.body].join('\u0000'));
    if(blocky) gap(tk.start);

    while(blocky && i + 1 < T.length && T[i+1].t === 'com' && T[i+1].attached){

    }

}
function wToSrc(w){
  for(var i = 0; i < doc.segs.length; i++){
    var g = doc.segs[i];
    if(w >= g.w && w <= g.w + g.len) return { src: g.s + (w - g.w), seg: i };

/* ===================== markdown ===================== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    .replace(/~~([^~]*)~~/g, '$1').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')

function inlineOff(s, off){

    var c = s.charAt(i), rest = s.slice(i), m;

      if(m){ flush(); out += '<strong>' + inlineOff(m[1], off+i+2) + '</strong>'; i += m[0].length; continue; }
    }
    if(c === '*'){

    }

function lineObjs(work, base){

var RE_FENCE = /^[ \t]*(```|~~~)/;
var RE_HR = /^\s*([-*_])\s*(\1\s*){2,}$/;
var RE_H = /^\s*(#{1,6})\s+(.*)$/;
var RE_UL = /^\s*([-*+])\s+(.*)$/;
var RE_OL = /^\s*\d+[.)]\s+(.*)$/;

  var head = doc.marks[ids[0]];

  var tag = ' data-mi="' + localOf(head) + '"';
  if(view === 'original') return head.t === 'ins' ? '' : renderPlain(head.t === 'hil' ? head.body : head.rem);
  if(view === 'final')    return head.t === 'del' ? '' : renderPlain(head.t === 'hil' ? head.body : head.add);
  var html = '';
  if(head.t === 'del') html = '<div class="blk del"' + tag + '>' + renderPlain(head.rem) + '</div>';
  else if(head.t === 'ins') html = '<div class="blk ins"' + tag + '>' + renderPlain(head.add) + '</div>';
  else html = '<div class="blk del"' + tag + '>' + renderPlain(head.rem) + '</div>' +

function blocks(L){

      if(!blankHtml(hIn)) out.push('<h' + lv + ' class="md-h">' + hIn + '</h' + lv + '>');

    }
    if(isTableHead(L, i)){

        if(!blankHtml(liIn)) items.push('<li>' + liIn + '</li>');

      continue;
    }

    while(i < L.length && !isBlockStart(L[i].s) && !isTableHead(L, i)){ para.push(L[i]); i++; }
    var pIn = para.map(function(x){ return inlineOff(x.s, x.o); })

    if(!blankHtml(pIn)) out.push('<p>' + pIn + '</p>');
  }

}

function tableAlign(sep){
  return sep.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function(c){

/* ===================== cells ===================== */
function segment(){
  var L = lineObjs(doc.work, 0), cells = [], i = 0;

    cells.push({ kind: kind, w0: from, w1: to, a: doc.map[from], b: doc.map[to], locked: !!locked });
  }
  while(i < L.length){
    var ln = L[i].s;
    if(/^\s*$/.test(ln)){ i++; continue; }
    var start = i;
    if(RE_FENCE.test(ln)){
      var open = RE_FENCE.exec(ln)[1]; i++;
      while(i < L.length && !(new RegExp('^[ \\t]*' + open)).test(L[i].s)) i++;
      if(i < L.length) i++;
      add('code', L[start].o, L[i-1].o + L[i-1].s.length, true);
      continue;
    }
    if(RE_HR.test(ln)){ add('hr', L[i].o, L[i].o + ln.length, true); i++; continue; }
    if(RE_PHLINE.test(ln)){ add('blockmark', L[i].o, L[i].o + ln.length, false); i++; continue; }
    if(RE_H.test(ln)){ add('heading', L[i].o, L[i].o + ln.length, false); i++; continue; }
    if(isTableHead(L, i)){
      i += 2;
      while(i < L.length && /\|/.test(L[i].s) && !/^\s*$/.test(L[i].s)) i++;
      add('table', L[start].o, L[i-1].o + L[i-1].s.length, false);
      continue;
    }
    if(/^\s*>/.test(ln)){
      while(i < L.length && /^\s*>/.test(L[i].s)) i++;
      add('quote', L[start].o, L[i-1].o + L[i-1].s.length, false);
      continue;
    }
    if(RE_UL.test(ln) || RE_OL.test(ln)){
      var ordered = RE_OL.test(ln);
      while(i < L.length && (ordered ? RE_OL.test(L[i].s) : RE_UL.test(L[i].s))) i++;
      add('list', L[start].o, L[i-1].o + L[i-1].s.length, false);
      continue;
    }
    i++;
    while(i < L.length && !isBlockStart(L[i].s) && !isTableHead(L, i)) i++;
    add('para', L[start].o, L[i-1].o + L[i-1].s.length, false);

function resolveRange(a, b, mode){
  var out = '';
  doc.tokens.forEach(function(tk){
    if(tk.t === 'text'){
      var s = Math.max(tk.start, a), e = Math.min(tk.start + tk.v.length, b);
      if(e > s) out += tk.v.slice(s - tk.start, e - tk.start);
      return;
    }
    if(tk.start < a || tk.end > b || tk.t === 'com') return;
    if(mode === 'orig'){
      if(tk.t === 'del' || tk.t === 'sub') out += tk.rem;
      else if(tk.t === 'hil') out += tk.body;
    } else {
      if(tk.t === 'ins' || tk.t === 'sub') out += tk.add;
      else if(tk.t === 'hil') out += tk.body;

}
function cellMarks(cell){
  return doc.marks.filter(function(m){ return !m.attached && m.start >= cell.a && m.end <= cell.b; });
}

/* ===================== word diff (CJK aware) ===================== */
function tokenize(s){
  var t = [], i = 0, n = s.length;
  while(i < n){
    var c = s.charAt(i);
    if(/\s/.test(c)){ var j = i; while(j < n && /\s/.test(s.charAt(j))) j++; t.push(s.slice(i, j)); i = j; continue; }
    if(/[A-Za-z0-9]/.test(c)){ var k = i; while(k < n && /[A-Za-z0-9_'’-]/.test(s.charAt(k))) k++; t.push(s.slice(i, k)); i = k; continue; }
    t.push(c); i++;

}
function diffTokens(A, B){
  var n = A.length, m = B.length, ops = [];

  var q = 0; while(q < n - p && q < m - p && A[n-1-q] === B[m-1-q]) q++;
  for(var i = 0; i < p; i++) ops.push(['=', A[i]]);
  var a = A.slice(p, n - q), b = B.slice(p, m - q);
  if(a.length && b.length && a.length * b.length <= 360000){
    var dp = new Array(a.length + 1);
    for(var r = 0; r <= a.length; r++) dp[r] = new Uint32Array(b.length + 1);
    for(var x = a.length - 1; x >= 0; x--)
      for(var y = b.length - 1; y >= 0; y--)
        dp[x][y] = (a[x] === b[y]) ? dp[x+1][y+1] + 1 : Math.max(dp[x+1][y], dp[x][y+1]);
    var ii = 0, jj = 0;
    while(ii < a.length && jj < b.length){
      if(a[ii] === b[jj]){ ops.push(['=', a[ii]]); ii++; jj++; }
      else if(dp[ii+1][jj] >= dp[ii][jj+1]){ ops.push(['-', a[ii]]); ii++; }
      else { ops.push(['+', b[jj]]); jj++; }
    }
    while(ii < a.length) ops.push(['-', a[ii++]]);
    while(jj < b.length) ops.push(['+', b[jj++]]);
  } else {
    a.forEach(function(v){ ops.push(['-', v]); });
    b.forEach(function(v){ ops.push(['+', v]); });
  }

}

function emitGroup(dels, inss){

  while(dels && inss && dels.charAt(0) === inss.charAt(0) && /\s/.test(dels.charAt(0))){
    pre += dels.charAt(0); dels = dels.slice(1); inss = inss.slice(1);
  }
  while(dels && inss && dels.slice(-1) === inss.slice(-1) && /\s/.test(dels.slice(-1))){
    suf = dels.slice(-1) + suf; dels = dels.slice(0, -1); inss = inss.slice(0, -1);
  }
  var mid = (dels && inss) ? '{~~' + dels + '~>' + inss + '~~}'

    var dels = '', inss = '';

try{ signHinted = localStorage.getItem('cm-signhint') === '1'; }catch(e){}

function cellComments(cell, skipWho){

/* ===================== compare ===================== */
/* Two versions of a document cannot be paired by position: insert one paragraph at the top

   aligned first — an LCS over their normalised text — and only the pairs that survived
   alignment are diffed word by word. */
var compareWith = null;   /* {key, name, src} — the OTHER version, read as the older side */

function docBlocks(src){
  var saved = doc;
  try{
    doc = parse(src); buildWorking(); segment();

      return { text: resolveRange(c.a, c.b, 'prop'), kind: c.kind };
    }).filter(function(b){ return b.text.replace(/\s/g, ''); });

   two hashes and a space are most of a short heading. */

  if(!A.length || !B.length) return 0;
  var bag = {}, hit = 0;
  A.forEach(function(t){ bag[t] = (bag[t] || 0) + 1; });
  B.forEach(function(t){ if(bag[t] > 0){ bag[t]--; hit++; } });
  return (2 * hit) / (A.length + B.length);

var PAIR_AT = 0.4;

function alignBlocks(oldB, newB){
  var ops = diffTokens(oldB.map(function(b){ return normBlock(b.text); }),
                       newB.map(function(b){ return normBlock(b.text); }));
  var out = [], oi = 0, ni = 0, i = 0;
  while(i < ops.length){
    if(ops[i][0] === '='){ out.push({ t:'same', a: oldB[oi++], b: newB[ni++] }); i++; continue; }
    var dels = [], inss = [];
    while(i < ops.length && ops[i][0] !== '='){
      if(ops[i][0] === '-') dels.push(oldB[oi++]); else inss.push(newB[ni++]);
      i++;

  if(view === 'original'){
    if(mk.t === 'ins' || mk.t === 'com') return '';

    return flat(mk.body);

  if(view === 'final'){

    return flat(mk.body);
  }
  if(mk.t === 'ins') return box('ins', flat(mk.add));
  if(mk.t === 'del') return box('del', flat(mk.rem));
  if(mk.t === 'sub') return box('del', flat(mk.rem)) + box('ins', flat(mk.add));

  else if(mk.t === 'del') txt = '<span class="was">' + e(mk.rem) + '</span>';
  else if(mk.t === 'sub') txt = '<span class="was">' + e(mk.rem) + '</span><span class="arrow">→</span><span class="now">' + e(mk.add) + '</span>';
  else if(mk.t === 'hil') txt = '<span class="quote">' + e(mk.body) + '</span>';

  } else if(mk.note || mk.t === 'com'){
    var body = mk.t === 'com' ? (mk.body || '') : mk.note;
    txt += '<span class="note" data-note="' + mi + '" role="button" tabindex="0" title="Click to edit this comment">' +
      (mk.who ? '<span class="by">@' + esc(mk.who) + '</span>' : '') +
      (body ? esc(body) : '<i class="nobody">empty comment</i>') +
      '<span class="pen" aria-hidden="true">✎</span></span>';
  }

  var who = (mk.who && !mk.note && mk.t !== 'com')
    ? '<span class="who"><span class="dot" style="background:hsl(' + hueOf(mk.who) + ' 52% 48%)"></span>@' + esc(mk.who) + '</span>' : '';
  var ops = editing ? '' : (single
    ? who + '<button type="button" class="y" data-act="accept" data-mi="' + mi + '" title="Resolve" aria-label="Resolve">✓</button>'
    : who + '<button type="button" class="y" data-act="accept" data-mi="' + mi + '" title="Accept" aria-label="Accept">✓</button>' +
            '<button type="button" class="n" data-act="reject" data-mi="' + mi + '" title="Reject" aria-label="Reject">✕</button>');

  return '<div class="mk' + (editing ? ' editing' : '') + '" data-k="' + mk.t + '" data-mi="' + mi + '">' +
    '<span class="chip">' + LABEL[mk.t] + '</span><span class="txt">' + txt + '</span>' +
    (ops ? '<span class="ops">' + ops + '</span>' : '') + '</div>';
}

/* the comment carrying a row's text: the mark itself when it is a comment, otherwise the
   comment attached just after it */
function noteMarkOf(mk){
  if(!mk) return null;
  if(mk.t === 'com') return mk;
  var kid = doc.marks[mk.id + 1];
  return (kid && kid.t === 'com' && kid.attached) ? kid : null;
}
function startNoteEdit(cell, mi){
  var mks = cellMarks(doc.cells[cell]);
  if(!noteMarkOf(mks[mi])) return;
  noteEdit = { cell: cell, mi: mi, text: null };
  render();
}
function cancelNoteEdit(){ if(!noteEdit) return; noteEdit = null; render(); }
function commitNoteEdit(){
  if(!noteEdit) return;
  var box = document.getElementById('notebox');
  var text = box ? box.value : '';
  var cell = doc.cells[noteEdit.cell];
  var mks = cell ? cellMarks(cell) : [];
  var com = noteMarkOf(mks[noteEdit.mi]);
  noteEdit = null;
  if(!com){ render(); return; }
  var body = scrub(text).replace(/\s*\n\s*/g, ' ').trim();
  if(!body){
    editSource(com.start, com.end, '');   /* emptied — the comment goes */
    toast('Comment removed');
    return;
  }
  editSource(com.start, com.end, '{>>' + (com.who ? '@' + com.who + '：' : '') + body + '<<}');
  toast('Comment updated');
}

/* ===================== rows ===================== */
function gapHtml(k){
  if(insertAt === k) return editorHtml('new', k);
  return '<div class="gap" data-gap="' + k + '"><button type="button" data-ins="' + k + '" title="Insert a new block here">+ new block</button></div>';
}

function editorHtml(kind, idx){
  var hint, mks = [];
  if(kind === 'cell'){
    mks = cellMarks(doc.cells[idx]);
    hint = mks.length
      ? 'carries <b>' + mks.length + '</b> existing suggestion' + (mks.length > 1 ? 's' : '') + '; comments are kept'
      : '<kbd>' + ENTER + '</kbd> or click away · <kbd>Esc</kbd> to discard';
  } else {
    hint = 'new block · <kbd>' + ENTER + '</kbd> or click away · <kbd>Esc</kbd> to discard';
  }
  return '<div class="ed" data-ed="' + kind + '">' +
    /* A cell editor holds prose, not markup — the marks are resolved away before the text
       reaches it — so the browser's own spell checker is useful here and only here. The raw
       markdown in the paste and export boxes keeps it off. */
    '<textarea id="edbox" spellcheck="true" aria-label="Block text"></textarea>' +
    '<div class="edbar"><span class="hint">' + hint + '</span>' +
      '<button type="button" data-edact="discard">Discard</button></div>' +
    '<div class="prev">' + previewHtml(kind, idx) + '</div></div>';
}

function previewHtml(kind, idx){
  var lab = '<div class="lab">recorded as</div>';
  if(tidy(draft) === tidy(draftBase)) return lab + '<p class="none">No change yet. Just edit the text above.</p>';
  if(kind === 'new'){
    var body = tidy(draft);
    if(!body) return lab + '<p class="none">Nothing to add yet.</p>';
    return lab + '<div class="inner">' + renderSnippet('{++' + body + '++}') + '</div>';
  }
  var built = buildBlockSource(doc.cells[idx], draft, '');
  if(!built.changed) return lab + '<p class="none">Back to the original — committing clears this block\'s suggestions.</p>';
  return lab + '<div class="inner">' + renderSnippet(built.src) + '</div>';
}

function renderSnippet(src){
  var saved = doc, savedView = view, savedLocal = localIdx;
  try{
    doc = parse(src); view = 'markup'; localIdx = {};
    buildWorking();
    return blocks(lineObjs(doc.work, 0));
  } finally {
    doc = saved; view = savedView; localIdx = savedLocal;
  }
}

function cellBody(idx){
  var cell = doc.cells[idx];
  var mks = cellMarks(cell);
  curCell = idx;
  localIdx = {};
  mks.forEach(function(m, n){ localIdx[m.id] = n; });
  if(openCell === idx && !cell.locked && view === 'markup') return editorHtml('cell', idx);
  var out = '<div class="out" data-cell="' + idx + '">' +
            blocks(lineObjs(doc.work.slice(cell.w0, cell.w1), 0)) + '</div>';
  if(cell.locked && cell.kind === 'code') out += '<p class="locknote">Code block — not tracked</p>';
  /* Original and Final show no inline marks, so a "comma → period" row there has nothing to
     point at. The rail flag carries the signal instead. */
  if(mks.length && view === 'markup') out += '<div class="marks">' + mks.map(markRow).join('') + '</div>';
  return out;
}

function cellHtml(idx){
  var cell = doc.cells[idx];
  var mks = cellMarks(cell);
  var cls = 'cell' + (cell.locked ? ' locked' : ' editable') +
            (openCell === idx ? ' open' : '') + (mks.length ? ' touched' : '');
  var flag = '';
  if(mks.length && view !== 'markup'){
    var noteOnly = mks.every(function(m){ return m.t === 'com' || m.t === 'hil'; });
    flag = '<button type="button" class="flag' + (noteOnly ? ' note-only' : '') + '" data-flag="' + idx + '" ' +
      'title="' + mks.length + ' suggestion' + (mks.length > 1 ? 's' : '') + ' here — show them">' + mks.length + '</button>';
  }
  return '<div class="' + cls + '" data-idx="' + idx + '">' +
    '<div class="rail"><span class="n">' + (idx + 1) + '</span>' + flag + '<span class="bar2"></span></div>' +
    '<div class="body">' + cellBody(idx) + '</div></div>';
}

function compareOptions(){
  var opts = [], seen = {};
  docs.forEach(function(r, i){
    if(i === activeDoc) return;
    seen[r.key] = 1;
    opts.push({ key: r.key, label: r.name + (r.path ? ' — ' + r.path : '') });
  });
  files.forEach(function(f){
    if(seen[f.key]) return;
    var cur = docs[activeDoc];
    if(cur && cur.key === f.key) return;
    opts.push({ key: f.key, label: f.path });
  });
  return opts;
}

function sameRow(r){
  return '<div class="cmp same"><div class="cmptag"></div><div class="cmpbody">' +
    renderPlain(r.b.text) + '</div></div>';
}
function renderCompare(){
  var cur = docs[activeDoc];
  var opts = compareOptions();
  var bar = '<div class="cmpbar">' +
    '<span class="side older">' + (compareWith ? esc(compareWith.name) : 'older version') + '</span>' +
    '<span class="arrow2">→</span>' +
    '<span class="side newer">' + esc(cur ? cur.name : '') + '</span>' +
    '<select id="cmppick" aria-label="Compare against">' +
      '<option value="">compare against…</option>' +
      opts.map(function(o){
        return '<option value="' + esc(o.key) + '"' +
          (compareWith && compareWith.key === o.key ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('') +
      /* a browsed file is not in the folder or open, so it needs its own option to show as
         the current selection */
      (compareWith && !opts.some(function(o){ return o.key === compareWith.key; })
        ? '<option value="' + esc(compareWith.key) + '" selected>' + esc(compareWith.name) + '</option>'
        : '') +
    '</select>' +
    '<button type="button" class="cmpbrowse" data-act3="browse" title="Compare against a file anywhere on disk">Browse…</button>' +
    '<span class="cmpstat" id="cmpstat"></span></div>';

  if(!compareWith){
    return bar + '<div class="cmpempty">Pick a file above to see what changed between it and ' +
      '<b>' + esc(cur ? cur.name : 'this document') + '</b>. The list holds the open documents ' +
      'and the connected folder; <b>Browse…</b> reaches anything else on disk.' +
      '<br><br>To compare against earlier commits of a file, run ' +
      '<code>node tools/history.mjs &lt;file&gt;</code> in the repo — it writes each version into ' +
      '<code>history/</code>, and they show up in the tree on the left.</div>';
  }

  var rows = compareRows();
  compareRowsCache = rows;
  var n = { added:0, removed:0, changed:0, same:0 };
  rows.forEach(function(r){ n[r.t]++; });

  var html = '', run = [], idx = 0;
  function flushRun(){
    if(!run.length) return;
    if(run.length <= 2){
      run.forEach(function(r){
        html += sameRow(r);
      });
    } else {
      html += '<button type="button" class="cmpfold" data-fold="' + idx + '">' +
        run.length + ' unchanged blocks</button>';
      html += '<div class="cmpfolded" data-foldbody="' + idx + '" hidden>' +
        run.map(sameRow).join('') + '</div>';
      idx++;
    }
    run = [];
  }

  rows.forEach(function(r, i){
    if(r.t === 'same'){ run.push(r); return; }
    flushRun();
    var tag = r.t === 'added' ? 'added' : r.t === 'removed' ? 'removed' : 'changed';
    html += '<div class="cmp ' + tag + '" data-chg="' + i + '" id="chg' + i + '">' +
      '<div class="cmptag">' + tag + '</div><div class="cmpbody">';
    if(r.t === 'added') html += '<div class="blk ins">' + renderPlain(r.b.text) + '</div>';
    else if(r.t === 'removed') html += '<div class="blk del">' + renderPlain(r.a.text) + '</div>';
    else {
      /* the same word diff the editor records, rendered the same way */
      var marked = opsToSource(diffTokens(tokenize(r.a.text), tokenize(r.b.text)), '');
      html += '<div class="cmpinline">' + renderSnippet(marked) + '</div>';
    }
    html += '</div></div>';
  });
  flushRun();

  var stat = [];
  if(n.changed) stat.push(n.changed + ' changed');
  if(n.added) stat.push(n.added + ' added');
  if(n.removed) stat.push(n.removed + ' removed');
  stat.push(n.same + ' unchanged');
  bar = bar.replace('<span class="cmpstat" id="cmpstat"></span>',
    '<span class="cmpstat">' + stat.join(' · ') + '</span>');

  if(!n.changed && !n.added && !n.removed){
    html = '<div class="cmpempty">These two versions say the same thing.</div>';
  }
  return bar + '<div class="cmplist">' + html + '</div>';
}

/* Rows are position-independent: cell HTML uses cell-relative offsets and cell-local mark
   indices, so an untouched cell renders byte-identical and its DOM node is never replaced —
   which is what lets a click on another cell survive the commit it triggers. */
function render(){
  buildWorking();
  segment();
  if(view === 'compare'){
    nb.innerHTML = renderCompare();
    rowCache = [];
    paintStatus(); paintOutline(); paintDocList();
    return;
  }
  var n = doc.cells.length;
  if(openCell !== null && openCell >= n) openCell = null;
  if(insertAt !== null && insertAt > n) insertAt = null;

  var rows = [];
  for(var k = 0; k <= n; k++) rows.push(gapHtml(k) + (k < n ? cellHtml(k) : ''));

  if(rows.length !== rowCache.length){
    nb.innerHTML = rows.map(function(h, k){ return '<div class="row" data-row="' + k + '">' + h + '</div>'; }).join('');
    rowCache = rows;
  } else {
    for(var j = 0; j < rows.length; j++){
      if(rows[j] === rowCache[j]) continue;
      var node = nb.querySelector('.row[data-row="' + j + '"]');
      if(node) node.innerHTML = rows[j];
      rowCache[j] = rows[j];
    }
  }
  mountEditor();
  paintStatus();
  paintLit();
  paintOutline();
  paintDocList();
}

function mountEditor(){
  var nb2 = document.getElementById('notebox');
  if(nb2 && !nb2.dataset.live){
    nb2.dataset.live = '1';
    var mks = noteEdit ? cellMarks(doc.cells[noteEdit.cell]) : [];
    var com = noteEdit ? noteMarkOf(mks[noteEdit.mi]) : null;
    nb2.value = com ? (com.body || '') : '';
    nb2.focus(); nb2.select();
  }
  var box = document.getElementById('edbox');
  if(!box) return;
  if(box.value !== draft) box.value = draft;
  autosize(box);
  if(!box.dataset.live){
    box.dataset.live = '1';
    box.focus();
    try{ box.setSelectionRange(box.value.length, box.value.length); }catch(e){}
  }
}
function autosize(box){ box.style.height = 'auto'; box.style.height = Math.max(box.scrollHeight, 62) + 'px'; }

var CJK = /[㐀-鿿぀-ヿ가-힯]/g;
function wordCount(s){
  var cjk = (s.match(CJK) || []).length;
  var lat = (s.replace(CJK, ' ').match(/[A-Za-z0-9][A-Za-z0-9'’-]*/g) || []).length;
  return cjk + lat;
}
/* The textarea's content is not in doc.src until the editor is committed, so a block you are
   typing in right now still counts as unsaved — otherwise Save greys out mid-edit. */
function editorPending(){
  return (openCell !== null || insertAt !== null) && tidy(draft) !== tidy(draftBase);
}
function canSave(){
  var r = docs[activeDoc];
  if(!r || r.scratch) return false;
  return isDirty() || editorPending();
}
function paintSaveState(){
  var b = document.getElementById('btn-save'), r = docs[activeDoc];
  b.disabled = !canSave();
  b.title = (r && r.scratch) ? 'The tutorial is a scratch pad — use “Save as” to keep it'
    : !canSave() ? 'No changes to save'
    : CAN_FS ? 'Write the file (' + MOD + 'S)' : CAN_DL ? 'Download the .md (' + MOD + 'S)' : 'Copy the markdown (' + MOD + 'S)';
}
function paintStatus(){
  var open = openCount();
  var label = view === 'original' ? 'original' : view === 'final' ? 'final' : 'current';
  var body = resolveRange(0, doc.src.length, view === 'original' ? 'orig' : 'prop');
  document.getElementById('stxt').textContent =
    doc.cells.length + ' blocks · ' + open + ' open suggestion' + (open === 1 ? '' : 's') +
    ' · ' + wordCount(body) + ' words ' + label;
  document.getElementById('docmeta').textContent = open ? open + ' to review' : 'all clear';
  document.getElementById('btn-undo').disabled = history.length === 0;
  document.getElementById('btn-all-yes').disabled = !open || view === 'compare';
  document.getElementById('btn-all-no').disabled = !open || view === 'compare';
  document.getElementById('dirty').hidden = !isDirty();
  paintSaveState();
}
function paintLit(){
  nb.querySelectorAll('.lit').forEach(function(e){ e.classList.remove('lit'); });
  if(!lit) return;
  var host = nb.querySelector('.cell[data-idx="' + lit.cell + '"]');
  if(!host) return;
  host.querySelectorAll('[data-mi="' + lit.mi + '"]').forEach(function(e){ e.classList.add('lit'); });
}

/* ===================== outline ===================== */
function headingCells(){
  var out = [];
  doc.cells.forEach(function(cell, i){
    if(cell.kind !== 'heading') return;
    var raw = resolveRange(cell.a, cell.b, view === 'original' ? 'orig' : 'prop');
    var m = /^\s*(#{1,6})\s/.exec(raw);
    out.push({ idx: i, level: m ? m[1].length : 1, text: bare(raw) || '(untitled)', marks: cellMarks(cell).length });
  });
  return out;
}
function paintOutline(){
  if(view === 'compare'){
    var host0 = document.getElementById('outlist');
    var rows = compareRowsCache || [];
    var chg = [];
    rows.forEach(function(r, i){ if(r.t !== 'same') chg.push({ i: i, t: r.t, text: (r.b || r.a).text }); });
    document.getElementById('out-ct').textContent = chg.length || '';
    host0.innerHTML = !compareWith
      ? '<div class="pane-empty">Pick a file to compare against.</div>'
      : (chg.length
          ? chg.map(function(c){
              return '<button type="button" class="out-row l1" data-jump="chg' + c.i + '">' +
                '<span class="ct ' + c.t + '">' + c.t.charAt(0).toUpperCase() + '</span>' +
                '<span class="t">' + esc(bare(c.text).slice(0, 60) || '(empty)') + '</span></button>';
            }).join('')
          : '<div class="pane-empty">No differences.</div>');
    var jn0 = document.getElementById('jump-next'), jp0 = document.getElementById('jump-prev');
    jn0.disabled = jp0.disabled = true;
    return;
  }
  var hs = headingCells();
  document.getElementById('out-ct').textContent = hs.length ? hs.length : '';
  var host = document.getElementById('outlist');
  if(!hs.length){
    host.innerHTML = '<div class="pane-empty">No headings in this document.</div>';
  } else {
    var min = Math.min.apply(null, hs.map(function(h){ return h.level; }));
    host.innerHTML = hs.map(function(h){
      var rel = Math.min(h.level - min + 1, 4);
      return '<button type="button" class="out-row l' + rel + '" data-goto="' + h.idx + '">' +
        '<span class="t">' + esc(h.text) + '</span>' +
        (h.marks ? '<span class="ct">' + h.marks + '</span>' : '') + '</button>';
    }).join('');
  }
  var touched = doc.cells.filter(function(c){ return cellMarks(c).length; }).length;
  var jn = document.getElementById('jump-next'), jp = document.getElementById('jump-prev');
  jn.disabled = jp.disabled = !touched;
  syncOutline();
}
var syncPending = false;
function syncOutline(){
  if(syncPending) return;
  syncPending = true;
  requestAnimationFrame(function(){
    syncPending = false;
    var rows = document.querySelectorAll('.out-row[data-goto]');
    if(!rows.length) return;
    var mark = center.scrollTop + 90, best = null;
    rows.forEach(function(r){
      var cell = nb.querySelector('.cell[data-idx="' + r.dataset.goto + '"]');
      if(cell && cell.offsetTop <= mark) best = r;
    });
    rows.forEach(function(r){ r.setAttribute('aria-current', String(r === best)); });
  });
}
function scrollToCell(idx, flash){
  var el = nb.querySelector('.cell[data-idx="' + idx + '"]');
  if(!el) return;
  center.scrollTo({ top: Math.max(0, el.offsetTop - 70), behavior: 'smooth' });
  if(flash){
    el.classList.add('open');
    setTimeout(function(){ el.classList.remove('open'); }, 900);
  }
}
function jumpSuggestion(dir){
  var list = [];
  doc.cells.forEach(function(c, i){ if(cellMarks(c).length) list.push(i); });
  if(!list.length) return;
  var here = center.scrollTop + 80, cur = -1;
  list.forEach(function(i, n){
    var el = nb.querySelector('.cell[data-idx="' + i + '"]');
    if(el && el.offsetTop <= here) cur = n;
  });
  var next = dir > 0 ? (cur + 1 >= list.length ? 0 : cur + 1)
                     : (cur <= 0 ? list.length - 1 : cur - 1);
  scrollToCell(list[next], true);
}

/* ===================== folders and files ===================== */
/* Folder mode and file mode are not a stored flag — folder mode is simply "a folder is
   connected". One piece of state instead of two that can disagree. */
var MARK_RE_COUNT = /\{\+\+[\s\S]*?\+\+\}|\{--[\s\S]*?--\}|\{~~[\s\S]*?~~\}|\{==[\s\S]*?==\}/g;
var MD_FILE = /\.(md|markdown|mdown)$/i;
var SKIP_DIR = { 'node_modules':1, 'dist':1, 'build':1, '.git':1 };

var folder = null;        /* {handle, name, abs} — non-null means folder mode */
var folderHistory = [];   /* [{handle, name, ts}] most recent first */
var files = [];           /* [{key, path, name, dir, handle, count, scanned}] */

/* The page can never learn a file's absolute path. But when the tool itself is opened as a
   local file and the folder you picked is the folder the tool sits in, the page's own
   location gives the prefix — so the title can show a real path instead of a relative one.
   Any other folder falls back to the relative path rather than guessing wrong. */
var SEP = '/';
function guessAbs(folderName){
  if(location.protocol !== 'file:') return null;
  var p = decodeURIComponent(location.pathname).replace(/\/[^\/]*$/, '');
  if(p.replace(/^.*\//, '') !== folderName) return null;
  /* file:///C:/x gives pathname "/C:/x" — show it the way the OS writes it */
  if(/^\/[A-Za-z]:/.test(p)){ SEP = '\\'; return p.slice(1).replace(/\//g, '\\'); }
  SEP = '/';
  return p;
}

/* Start every picker where the work is: the open file's own directory, else the connected
   folder. `id` lets the browser remember across sessions, and wins over startIn, so the
   calls that must land somewhere specific omit it. */
function pickerOpts(extra, anchored){
  var o = {};
  if(!anchored) o.id = 'critic-notebook';
  if(fileHandle) o.startIn = fileHandle;
  else if(folder) o.startIn = folder.handle;
  if(extra) for(var k in extra) o[k] = extra[k];
  return o;
}

function walkFolder(dir, prefix, depth, out){
  if(depth > 6) return Promise.resolve(out);
  var it = dir.entries();
  function step(){
    return it.next().then(function(res){
      if(res.done) return out;
      var name = res.value[0], entry = res.value[1];
      if(name.charAt(0) === '.' || SKIP_DIR[name]) return step();
      if(entry.kind === 'directory') return walkFolder(entry, prefix + name + '/', depth + 1, out).then(step);
      if(MD_FILE.test(name)) out.push({ key: prefix + name, path: prefix + name, name: name, dir: prefix, handle: entry });
      return step();
    });
  }
  return step();
}

function useFolder(h, quiet){
  folder = { handle: h, name: h.name, abs: guessAbs(h.name) };
  files = [];
  loadExpanded();
  paintDocList();
  rememberFolder(h);
  return walkFolder(h, '', 0, []).then(function(list){
    /* sort by path segments: plain string order puts "samples-local/" before "samples/",
       because '-' sorts below '/'. Swapping the separator for NUL restores tree order. */
    function k(d){ return d.replace(/\//g, '\u0000'); }
    list.sort(function(a, b){
      if(a.dir !== b.dir) return k(a.dir) < k(b.dir) ? -1 : 1;
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
    });
    files = list;
    pruneSample();
    relocateActive();
    paintDocList();
    scanCounts();
    if(!quiet) toast(list.length ? h.name + ' — ' + list.length + ' markdown file' + (list.length === 1 ? '' : 's')
                                 : 'No markdown files in ' + h.name);
  }).catch(function(){ toast('Could not read that folder'); });
}

function toFileMode(){
  folder = null;
  files = [];
  currentEntry = null;
  paintTitle();
  paintDocList();
}

/* if the open document lives inside the newly connected folder, give it its path there */
function relocateActive(){
  var r = docs[activeDoc];
  if(!r || !fileHandle || !folder || !folder.handle.resolve) return Promise.resolve();
  return folder.handle.resolve(fileHandle).then(function(segs){
    if(!segs) return;
    r.path = segs.join('/');
    r.key = r.path;
    paintTitle();
    paintDocList();
  }).catch(function(){});
}

/* fill in per-file suggestion counts in the background, with a budget so a big folder
   cannot stall the pane */
function scanCounts(){
  var budget = 5 * 1024 * 1024, done = 0, batch = files.slice(0, 300);
  var chain = Promise.resolve();
  batch.forEach(function(f){
    chain = chain.then(function(){
      if(f.scanned || budget <= 0) return;
      return f.handle.getFile().then(function(file){
        if(file.size > 1024 * 1024){ f.scanned = true; return; }
        budget -= file.size;
        return file.text().then(function(t){
          f.count = (t.match(MARK_RE_COUNT) || []).length;
          f.scanned = true;
          if(++done % 10 === 0) paintDocList();
        });
      }).catch(function(){ f.scanned = true; });
    });
  });
  chain.then(paintDocList);
}

/* ---------- folder history ---------- */
function saveHistory(){
  /* expansion state is keyed by folder name and would otherwise accumulate a key per folder
     ever opened; drop the ones no history entry can reach */
  try{
    var live = {};
    folderHistory.forEach(function(e){ live['cm-open-' + e.name] = 1; });
    if(folder) live['cm-open-' + folder.name] = 1;
    for(var i = localStorage.length - 1; i >= 0; i--){
      var k = localStorage.key(i);
      if(k && k.indexOf('cm-open-') === 0 && !live[k]) localStorage.removeItem(k);
    }
  }catch(e){}
  return idbSet('folders', folderHistory.map(function(e){
    return { handle: e.handle, name: e.name, ts: e.ts };
  }));
}
/* Two folders can share a basename, so identity is isSameEntry, not the name — and that is
   async, hence the chain. */
function rememberFolder(h){
  var chain = Promise.resolve(-1);
  folderHistory.forEach(function(e, i){
    chain = chain.then(function(found){
      if(found >= 0) return found;
      if(!e.handle || !e.handle.isSameEntry) return -1;
      return e.handle.isSameEntry(h).then(function(same){ return same ? i : -1; }).catch(function(){ return -1; });
    });
  });
  return chain.then(function(i){
    if(i >= 0) folderHistory.splice(i, 1);
    folderHistory.unshift({ handle: h, name: h.name, ts: Date.now() });
    if(folderHistory.length > 8) folderHistory.length = 8;
    currentEntry = folderHistory[0];
    paintDocList();
    return saveHistory();
  });
}
function openHistory(i){
  var e = folderHistory[i];
  if(!e || !e.handle) return;
  var go = function(){ return useFolder(e.handle); };
  if(!e.handle.queryPermission) return go();
  e.handle.queryPermission({ mode: 'readwrite' }).then(function(p){
    if(p === 'granted') return go();
    return e.handle.requestPermission({ mode: 'readwrite' }).then(function(q){
      if(q === 'granted') return go();
      toast('Permission declined');
    });
  }).catch(function(){ toast('That folder is no longer reachable — open it again'); });
}

function pickFolder(anchor){
  if(!CAN_DIR){ toast('This browser cannot open folders'); return Promise.resolve(); }
  var opts = anchor ? { mode: 'readwrite', startIn: anchor } : pickerOpts({ mode: 'readwrite' });
  return window.showDirectoryPicker(opts).then(function(h){
    return useFolder(h);
  }).catch(function(e){
    if(!e || e.name !== 'AbortError') toast('Could not open that folder');
  });
}

var currentEntry = null;   /* the folderHistory row for the connected folder */

function expandKey(){ return 'cm-open-' + (folder ? folder.name : ''); }
function loadExpanded(){

  }catch(e){}

function expandTo(path){

  var acc = '';
  parts.forEach(function(seg){ acc += seg + '/'; expanded[acc] = true; });

function buildTree(){
  var root = { name: folder ? folder.name : '', path: '', dirs: [], files: [], map: {} };
  files.forEach(function(f){
    var node = root;
    if(f.dir){
      var acc = '';
      f.dir.replace(/\/$/, '').split('/').forEach(function(seg){
        acc += seg + '/';
        if(!node.map[seg]){
          var kid = { name: seg, path: acc, dirs: [], files: [], map: {} };
          node.map[seg] = kid; node.dirs.push(kid);
        }
        node = node.map[seg];
      });
    }
    node.files.push(f);
  });
  return root;
}
function nodeStats(node){
  var n = node.files.length, c = 0;
  node.files.forEach(function(f){ c += fileCount(f) || 0; });
  node.dirs.forEach(function(d){ var st = nodeStats(d); n += st.n; c += st.c; });
  return { n: n, c: c };
}
function renderNode(node, depth){
  var pad = 8 + depth * 14, html = '';
  /* files first: in a document folder the files are the point, the subfolders are where you
     go next */
  node.files.forEach(function(f){
    var i = findDoc(f.key), cnt = fileCount(f);
    html += '<button type="button" class="doc-row file" data-key="' + esc(f.key) + '"' +
      ' aria-current="' + (i >= 0 && i === activeDoc) + '" style="padding-left:' + pad + 'px">' +
      '<span class="ico doc">' + ICO_DOC + '</span>' +
      '<span class="nm">' + esc(f.name) + '</span>' +
      (cnt ? '<span class="badge">' + cnt + '</span>' : '') +
      (fileDirty(f) ? '<span class="udot" title="unsaved">●</span>' : '') + '</button>';
  });
  node.dirs.forEach(function(d){
    var open = !!expanded[d.path], st = nodeStats(d);
    html += '<button type="button" class="doc-row dir" data-dir="' + esc(d.path) + '"' +
      ' aria-expanded="' + open + '" style="padding-left:' + pad + 'px">' +
      '<span class="ico">' + (open ? ICO_DIR_OPEN : ICO_DIR) + '</span>' +
      '<span class="nm">' + esc(d.name) + '</span>' +
      (st.c ? '<span class="badge">' + st.c + '</span>' : '') +
      '<span class="cnt">' + st.n + '</span></button>';
    if(open) html += renderNode(d, depth + 1);

}

function fileCount(f){
  var i = findDoc(f.key);
  if(i < 0) return f.scanned ? f.count : null;
  var src = i === activeDoc ? doc.src : docs[i].src;
  return (src.match(MARK_RE_COUNT) || []).length;
}
function fileDirty(f){
  var i = findDoc(f.key);

  return i === activeDoc ? isDirty() : docs[i].src !== docs[i].savedSrc;

function rowHtml(label, key, cnt, dirtyNow, isActive){
  return '<button type="button" class="doc-row" data-key="' + esc(key) + '" aria-current="' + isActive + '">' +
    '<span class="nm">' + esc(label) + '</span>' +

    (dirtyNow ? '<span class="udot" title="unsaved">●</span>' : '') + '</button>';
}
function docRows(list){
  return list.map(function(r){
    var i = findDoc(r.key);
    var src = i === activeDoc ? doc.src : r.src;
    return rowHtml(r.name, r.key, (src.match(MARK_RE_COUNT) || []).length,
      i === activeDoc ? isDirty() : r.src !== r.savedSrc, i === activeDoc);

function paintDocList(){

  if(folder){
    html += '<div class="folder-bar"><span class="fn" title="' + esc(folder.abs || folder.name) + '">' +

/* ===================== source edits ===================== */
function snapshot(){ history.push(doc.src); if(history.length > 80) history.shift(); }
function commitSource(src){
  snapshot();
  doc = parse(src);
  lit = null; noteEdit = null;
  render();
}
function editSource(a, b, repl){ commitSource(doc.src.slice(0, a) + repl + doc.src.slice(b)); }
function undo(){
  if(!history.length) return;
  openCell = null; insertAt = null; draft = ''; draftBase = ''; hidePop();
  doc = parse(history.pop());
  lit = null;
  render();
  toast('Undone');
}

function resolveText(mk, v){
  if(mk.t === 'ins') return v === 'accept' ? mk.add : '';
  if(mk.t === 'del') return v === 'accept' ? '' : mk.rem;
  if(mk.t === 'sub') return v === 'accept' ? mk.add : mk.rem;
  if(mk.t === 'hil') return mk.body;
  return '';
}
function spanOf(mk){
  var end = mk.end, kid = doc.marks[mk.id + 1];
  if(kid && kid.attached && kid.start === mk.end) end = kid.end;
  return end;
}
function resolveMark(id, v){
  var mk = doc.marks[id];
  if(!mk) return;
  editSource(mk.start, spanOf(mk), resolveText(mk, v));
}
function resolveAll(v){
  var src = doc.src;
  doc.marks.filter(function(m){ return !m.attached; }).slice().reverse().forEach(function(mk){
    src = src.slice(0, mk.start) + resolveText(mk, v) + src.slice(spanOf(mk));
  });
  commitSource(src);
}

/* ===================== editing ===================== */
function openEditor(idx){
  if(view === 'compare') return;
  if(view !== 'markup'){ toast('Switch to “Marked up” to edit'); return; }
  var cell = doc.cells[idx];
  if(!cell || cell.locked) return;
  if(openCell === idx) return;
  flushEditor();
  if(!doc.cells[idx]) return;
  openCell = idx; insertAt = null;
  draftBase = resolveRange(doc.cells[idx].a, doc.cells[idx].b, 'prop');
  draft = draftBase;
  render();
}
function openInsert(k){
  if(view !== 'markup'){ toast('Switch to “Marked up” to edit'); return; }
  flushEditor();
  insertAt = Math.min(k, doc.cells.length); openCell = null;
  draftBase = ''; draft = '';
  render();
}
function discardEditor(){
  if(openCell === null && insertAt === null) return;
  openCell = null; insertAt = null; draft = ''; draftBase = '';
  render();
}
function flushEditor(){
  var box = document.getElementById('edbox');
  if(box) draft = box.value;
  var wasCell = openCell, wasInsert = insertAt, text = draft, base = draftBase;
  openCell = null; insertAt = null; draft = ''; draftBase = '';
  if(wasCell === null && wasInsert === null) return false;
  if(tidy(text) === tidy(base)) return false;

  var who = authorName(), stamp = who ? '{>>@' + who + '<<}' : '';

  if(wasInsert !== null){
    /* the separating blank line goes INSIDE the mark, or rejecting the new block would
       leave its blank lines behind in the original */
    var body = tidy(text);
    if(!body) return false;
    var cells = doc.cells, at, repl;
    if(!cells.length){ at = 0; repl = '{++' + body + '++}' + stamp; }
    else if(wasInsert === 0){ at = cells[0].a; repl = '{++' + body + '\n\n++}' + stamp; }
    else { at = cells[Math.min(wasInsert, cells.length) - 1].b; repl = '{++\n\n' + body + '++}' + stamp; }
    editSource(at, at, repl);
    maybeSignHint();
    toast('New block added as a suggestion');
    return true;
  }

  var cell = doc.cells[wasCell];
  if(!cell) return false;
  var built = buildBlockSource(cell, text, stamp);
  var kept = built.changed ? cellComments(cell, who) : '';
  var hadDelims = DANGER_RE.test(text);
  DANGER_RE.lastIndex = 0;
  editSource(cell.a, cell.b, built.src + kept);
  if(built.changed) maybeSignHint();
  toast(hadDelims ? 'Recorded (markup characters you typed were replaced with spaces)'
                  : (built.changed ? 'Change recorded' : 'Block restored to the original'));
  return true;
}

nb.addEventListener('change', function(ev){
  if(ev.target.id !== 'cmppick') return;

  if(!key){ compareWith = null; render(); return; }
  var i = findDoc(key);
  if(i >= 0){
    compareWith = { key: key, name: docs[i].name, src: i === activeDoc ? doc.src : docs[i].src };
    render();

  }
  var f = null;
  files.forEach(function(x){ if(x.key === key) f = x; });
  if(!f) return;
  f.handle.getFile().then(function(file){ return file.text(); }).then(function(t){
    compareWith = { key: key, name: f.name, src: t.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n') };
    render();

});

function browseCompare(){
  function take(name, text){
    compareWith = { key: 'browsed:' + name, name: name,
                    src: text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n') };
    render();
  }
  if(CAN_FS && typeof window.showOpenFilePicker === 'function'){
    window.showOpenFilePicker(pickerOpts({ types: MD_TYPES, multiple: false })).then(function(hs){
      var h = hs[0];
      return h.getFile().then(function(f){
        return f.text().then(function(t){ take(f.name, t); });
      });
    }).catch(function(e){
      if(e && e.name === 'AbortError') return;
      document.getElementById('cmpfile').click();

  }
  document.getElementById('cmpfile').click();
}

                    src: String(r.result).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n') };

/* ===================== selection → comment ===================== */
function cellOfNode(node){
  var el = node.nodeType === 3 ? node.parentNode : node;
  var host = el && el.closest ? el.closest('.cell[data-idx]') : null;
  return host ? doc.cells[+host.dataset.idx] : null;
}
/* Range.comparePoint is non-standard; compareBoundaryPoints is not, and says the same
   thing: -1 the point is before the range, 0 inside it, 1 after. */
function cmpPoint(r, node, off){
  var t = (node.ownerDocument || document).createRange();
  t.setStart(node, off); t.collapse(true);
  if(r.compareBoundaryPoints(Range.START_TO_START, t) > 0) return -1;
  if(r.compareBoundaryPoints(Range.START_TO_END, t) < 0) return 1;
  return 0;
}
function selRange(){
  var sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return null;
  var r = sel.getRangeAt(0);
  var el = r.commonAncestorContainer;
  el = el.nodeType === 3 ? el.parentNode : el;
  if(!el || !el.closest || !el.closest('.out[data-cell]')) return null;

  var spans = nb.querySelectorAll('.out .tx'), hits = [];
  for(var i = 0; i < spans.length; i++){
    var tn = spans[i].firstChild;
    if(!tn || tn.nodeType !== 3) continue;
    var len = tn.nodeValue.length;
    if(!len) continue;
    var cs, ce;
    try{ cs = cmpPoint(r, tn, 0); ce = cmpPoint(r, tn, len); } catch(e){ continue; }
    if(cs > 0 || ce < 0) continue;
    var cell = cellOfNode(spans[i]);
    if(!cell) continue;
    var s = (cs < 0) ? (r.startContainer === tn ? r.startOffset : 0) : 0;
    var e = (ce > 0) ? (r.endContainer === tn ? r.endOffset : len) : len;
    if(e > s) hits.push({ o: cell.w0 + (+spans[i].getAttribute('data-o')) + s, len: e - s });
  }
  if(!hits.length) return null;
  var A = wToSrc(hits[0].o), last = hits[hits.length - 1], B = wToSrc(last.o + last.len);
  if(!A || !B) return null;
  if(A.seg !== B.seg) return { err: 'cross' };
  if(B.src <= A.src) return null;
  var text = doc.src.slice(A.src, B.src);
  if(/\n/.test(text)) return { err: 'line' };
  return { a: A.src, b: B.src, text: text };
}

var pop = null, popRect = null;
function hidePop(){ if(pop){ pop.remove(); pop = null; popRect = null; } }
function placePop(){
  if(!pop || !popRect) return;
  var w = pop.offsetWidth, h = pop.offsetHeight;
  var left = Math.min(Math.max(8, popRect.left + popRect.width/2 - w/2), Math.max(8, window.innerWidth - w - 8));
  var top = popRect.top - h - 8;
  if(top < 8) top = Math.min(popRect.bottom + 8, window.innerHeight - h - 8);
  pop.style.left = left + 'px';
  pop.style.top = Math.max(8, top) + 'px';
}
function clip(s, n){ s = String(s).replace(/\s+/g, ' '); return s.length > n ? s.slice(0, n) + '…' : s; }

function openPop(range, rect){
  hidePop();
  pop = document.createElement('div');
  pop.className = 'pop';
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-label', 'Comment on the selected text');
  pop.addEventListener('mousedown', function(ev){ if(ev.target.tagName !== 'INPUT') ev.preventDefault(); });
  document.body.appendChild(pop);
  popRect = rect;

  if(range.err){
    pop.innerHTML = '<p class="err">' +
      (range.err === 'cross' ? 'That selection already contains a suggestion. Pick plain text.'
                             : 'Keep the selection on one line.') +
      '</p><div class="row"><button type="button" data-x="close">OK</button></div>';
    pop.querySelector('[data-x="close"]').addEventListener('click', hidePop);
    placePop();
    return;
  }
  pop.innerHTML =
    '<p class="sel">“' + esc(clip(range.text, 38)) + '”</p>' +
    '<label for="pn">Comment</label><input type="text" id="pn" autocomplete="off" placeholder="what should change, and why">' +
    '<div class="row"><button type="button" data-x="close">Cancel</button>' +
    '<button type="button" class="go" data-x="go">Add comment</button></div>';
  var input = pop.querySelector('#pn');
  placePop();
  input.focus();
  function go(){
    var note = scrub(input.value.trim()).replace(/\s*\n\s*/g, ' ');
    if(!note){ input.focus(); return; }
    var who = authorName();
    var repl = '{==' + range.text + '==}{>>' + (who ? '@' + who + '：' : '') + note + '<<}';
    hidePop();
    var sel = window.getSelection();
    if(sel && sel.removeAllRanges) sel.removeAllRanges();
    editSource(range.a, range.b, repl);
    toast('Comment added');
  }
  pop.querySelector('[data-x="go"]').addEventListener('click', go);
  pop.querySelector('[data-x="close"]').addEventListener('click', hidePop);
  input.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); go(); }
    if(ev.key === 'Escape'){ ev.preventDefault(); hidePop(); }
  });
}
function maybePop(){
  if(view !== 'markup' || openCell !== null || insertAt !== null){ hidePop(); return; }
  var sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed){ hidePop(); return; }
  var range = selRange();
  if(!range){ hidePop(); return; }
  openPop(range, sel.getRangeAt(0).getBoundingClientRect());
}
['mouseup','touchend'].forEach(function(name){
